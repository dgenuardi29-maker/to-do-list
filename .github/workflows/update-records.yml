name: Update team records

on:
  schedule:
    - cron: '17 12 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-team-records
  cancel-in-progress: false

jobs:
  update-records:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch current records
        run: node scripts/update-records.mjs

      - name: Commit changed records
        run: |
          if git diff --quiet -- records.json; then
            echo "Team records have not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records.json
          git commit -m "Update college football records"
          git push
